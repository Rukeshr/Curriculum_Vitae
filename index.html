<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Rukesh R — Network & Security Consultant. Resume.">
<title>Rukesh R | Network & Security Consultant</title>
<style>
:root {
  --color-1: #000000; 
  --color-2: #0066CC; 
  --color-3: #2997FF; 
  --color-4: #D2D2D7; 
  --color-5: #F5F5F7; 
  --color-6: #FFFFFF;

  --bg: var(--color-5);
  --card: var(--color-6);
  --text: var(--color-1);
  --heading: var(--color-1);
  --accent: var(--color-2);
  --accent-2: var(--color-3);
  --line: var(--color-4);
  --chip: var(--color-4);
  --muted: rgba(0, 0, 0, .56); 

  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 17px;
  --text-lg: 44px;

  --space-2: 4px;  --space-4: 6px;  --space-5: 8px;  --space-7: 10px; --space-9: 12px;
  --space-12: 16px; --space-14: 20px; --space-15: 22px; --space-16: 24px; --space-18: 44px;

  --radius-sm: 8px;
  --radius-full: 50%;
  --radius-lg: 980px;
  --radius-xl: 999px;

  --shadow-sm: rgba(0, 0, 0, .22) 3px 5px 30px 0px;

  --duration-fast: background-color .1s linear;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 var(--text-base)/1.5 var(--font-sans);
}
.wrap { max-width: 900px; margin: 0 auto; padding: var(--space-16) var(--space-12) var(--space-18); position: relative; z-index: 1; }

header {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: var(--space-16);
  display: flex;
  gap: var(--space-16);
  align-items: center;
  flex-wrap: wrap;
}
.eyebrow { font-size: var(--text-xs); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0; }
h1 { margin: var(--space-2) 0; font-size: var(--text-lg); font-weight: 600; letter-spacing: -.02em; color: var(--heading); }
.sub { margin: 0; color: var(--muted); font-size: var(--text-sm); }
.avatar {
  width: 96px; height: 96px; border-radius: var(--radius-full);
  background: var(--accent); color: var(--color-6);
  display: grid; place-items: center;
  font-size: var(--text-base); font-weight: 600;
  object-fit: cover; flex: none;
}
.info { flex: 1; min-width: 220px; }
.contact { display: flex; gap: var(--space-12); flex-wrap: wrap; margin-top: var(--space-7); }
a { color: var(--accent); text-decoration: none; transition: var(--duration-fast); }
a:hover { color: var(--accent-2); text-decoration: underline; }
a:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.badges { display: flex; gap: var(--space-5); flex-wrap: wrap; margin-top: var(--space-12); }
.badge, .chip {
  background: var(--chip); color: var(--accent);
  border-radius: var(--radius-xl); padding: var(--space-2) var(--space-12); font-size: var(--text-xs);
  font-weight: 600;
}

section {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: var(--space-16) var(--space-16);
  margin-top: var(--space-12);
}
h2 {
  margin: 0 0 var(--space-14);
  font-size: var(--text-base);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--accent);
}
h3 { margin: 0; font-size: var(--text-base); font-weight: 600; color: var(--heading); }
.meta { color: var(--muted); font-size: var(--text-sm); margin: 0 0 var(--space-5); }
.job { padding: var(--space-14) 0; border-top: 1px solid var(--line); }
.job:first-of-type { border-top: 0; padding-top: 0; }
ul { margin: var(--space-5) 0 0; padding-left: var(--space-14); }
li { margin: var(--space-4) 0; font-size: var(--text-base); }
.chips { display: flex; gap: var(--space-4); flex-wrap: wrap; }
.group { margin-bottom: var(--space-14); }
.group h3 { font-size: var(--text-sm); font-weight: 600; margin-bottom: var(--space-5); color: var(--text); }
footer { text-align: center; color: var(--muted); margin-top: var(--space-16); font-size: var(--text-xs); }

/* ---- Decorative background: network / security motif ----
   Dot-grid = network topology nodes. Roaming glow = signal/data flow.
   Scanning beam = a classic security-monitoring visual. All layers stay
   low-opacity and behind the opaque cards, and use only palette colors
   (color-2/color-3 accent blues) so nothing outside the token set is introduced. */
.bg-fx { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg-fx .grid {
  position: absolute; inset: -42px;
  background-image:
    linear-gradient(rgba(0, 102, 204, .08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 102, 204, .08) 1px, transparent 1px);
  background-size: 42px 42px;
  -webkit-mask-image: radial-gradient(ellipse 75% 55% at 50% 0%, #000 40%, transparent 92%);
          mask-image: radial-gradient(ellipse 75% 55% at 50% 0%, #000 40%, transparent 92%);
}
.bg-fx .nodes {
  position: absolute; inset: -42px;
  background-image: radial-gradient(circle, rgba(41, 151, 255, .45) 1.5px, transparent 1.6px);
  background-size: 42px 42px;
  -webkit-mask-image: radial-gradient(ellipse 75% 55% at 50% 0%, #000 40%, transparent 92%);
          mask-image: radial-gradient(ellipse 75% 55% at 50% 0%, #000 40%, transparent 92%);
  animation: node-pulse 6s ease-in-out infinite;
}
.bg-fx .glow {
  position: absolute; width: 560px; height: 560px; left: -160px; top: -180px;
  border-radius: var(--radius-full);
  background: radial-gradient(circle, rgba(0, 102, 204, .16), transparent 70%);
  filter: blur(6px);
  animation: drift 24s ease-in-out infinite alternate;
}
.bg-fx .scan {
  position: absolute; left: 0; right: 0; height: 160px; top: -160px;
  background: linear-gradient(180deg, transparent, rgba(41, 151, 255, .12), transparent);
  animation: scan 10s linear infinite;
}
@keyframes node-pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
@keyframes drift { from { transform: translate(0, 0); } to { transform: translate(110px, 160px); } }
@keyframes scan { 0% { top: -160px; } 100% { top: 100%; } }
@media (prefers-reduced-motion: reduce) {
  .bg-fx .nodes, .bg-fx .glow, .bg-fx .scan { animation: none; }
}

@media print {
  body { background: var(--color-6); }
  section, header { border: 0; box-shadow: none; }
  .bg-fx { display: none; }
}
</style>
</head>
<body>
<div class="bg-fx" aria-hidden="true">
  <div class="grid"></div>
  <div class="nodes"></div>
  <div class="glow"></div>
  <div class="scan"></div>
</div>
<div class="wrap" id="app"></div>

<script>
const RESUME_DATA = {
  name: "Rukesh R",
  title: "Sr Technical Consultant | Network & Security",
  tagline: "Enterprise Networking & Infrastructure Security",
  initials: "RR",
  photo: "", // optional image URL
  phone: "+91 88800 31699",
  email: "rukesh.16r@gmail.com",
  badges: ["Cisco Certified CCNA", "Fortinet NSE 4 Certified"],
  summary: [
    "Network & Security Consultant with 5+ years of experience designing, implementing, and supporting enterprise networking and cybersecurity solutions for manufacturing, healthcare, automotive, BFSI, government, and IT/ITES customers. Delivers enterprise infrastructure projects end-to-end, from requirement analysis and solution design through implementation and post-deployment support.",
    "Certified in CCNA and Fortinet NSE 1–3, with hands-on expertise across Cisco, Palo Alto Networks, Fortinet, Zscaler, and SentinelOne technologies. Strong experience in enterprise LAN/WAN architecture and routing and switching technologies including OSPF, EIGRP, BGP, VLAN, STP, EtherChannel, HSRP, and VRRP, along with secure network design covering firewalls, VPNs, NAT, and access control.",
    "Experienced across the complete solution lifecycle — requirement gathering, architecture design, HLD/LLD documentation, BOM preparation, implementation planning, deployment, and troubleshooting. Skilled at root-cause analysis for business-critical network and security incidents, and at preparing technical documentation that supports ongoing operations and upgrades.",
    "Works closely with customers, field engineering teams, and OEM partners including Cisco, Palo Alto Networks, and Fortinet to deliver secure, reliable infrastructure across multi-site enterprise environments."
  ],
  experience: [
    {
      role: "Sr Technical Consultant", company: "Connectivity IT Solutions Pvt Ltd", period: "2024 – Present",
      points: [
        "Design and deliver enterprise LAN, WAN, firewall, and wireless solutions for customers across manufacturing, healthcare, automotive, BFSI, and government sectors.",
        "Author High-Level Design (HLD), Low-Level Design (LLD), and as-built documentation for enterprise networking and security deployments.",
        "Support pre-sales engagements with solution design, bill-of-materials preparation, technical inputs for RFP/RFI responses, and effort estimation.",
        "Design high-availability Layer 2 and Layer 3 architectures using OSPF, EIGRP, BGP, VLAN, STP, EtherChannel, HSRP, and VRRP.",
        "Configure and harden firewall policies, site-to-site and remote-access VPNs, NAT, and access-control frameworks across Cisco, Palo Alto, and FortiGate platforms.",
        "Conduct root-cause analysis for business-critical network and security escalations, minimising customer downtime.",
        "Run customer workshops, proof-of-concepts, and solution demonstrations to validate solution fit and support decision-making.",
        "Collaborate with OEM partners and field engineering teams, and share technical knowledge with junior engineers through design reviews."
      ]
    },
    {
      role: "Technical Consultant", company: "Connectivity IT Solutions Pvt Ltd", period: "Jul 2023 – 2024",
      points: [
        "Deployed Cisco and Arista LAN infrastructure for Micron, integrating wired, wireless, and Palo Alto security.",
        "Designed and deployed LAN/WAN routing, switching, and FortiGate security for Shearwater Health.",
        "Deployed and configured Palo Alto firewalls to secure enterprise network access for Pegatron.",
        "Deployed Zscaler ZTP for secure internet access and traffic management at Toyota Kirloskar Motors.",
        "Installed and configured head-end routers for secure network communication for Karnataka State Police.",
        "Supported SentinelOne Ranger AD deployment with Active Directory integration for Axis Bank.",
        "Provided remote support for network, firewall, and connectivity issues for InMobi.",
        "Prepared technical documentation and reports to support ongoing operations and upgrades."
      ]
    },
    {
      role: "Software Engineer", company: "Idexcel Technologies", period: "Sep 2020 – Nov 2022",
      points: [
        "Upgraded a microservices architecture by migrating Ruby on Rails 4 to 6 and Ruby 2.5 to 3.0.",
        "Built customer-facing features in Ruby on Rails with HTML, CSS, and JavaScript front ends."
      ]
    }
  ],
  skills: [
    { group: "Routing & Switching", items: ["OSPF", "EIGRP", "BGP", "VLANs", "Inter-VLAN Routing", "VTP", "Spanning Tree", "EtherChannel", "HSRP", "VRRP"] },
    { group: "Firewalls & Security", items: ["Cisco ASA / FTD", "Palo Alto", "FortiGate (UTM, HA)", "Check Point", "Zscaler", "SentinelOne", "Site-to-Site & Remote VPN", "ACLs / NAT"] },
    { group: "Infrastructure Services", items: ["DHCP", "NAT / PAT", "SNMP", "Syslog", "NTP"] },
    { group: "Tools & Platforms", items: ["Wireshark", "Cisco DNA Center", "Packet Tracer", "Catalyst 9300 / 9500", "ISR / ASR Routers"] },
    { group: "Solution Delivery", items: ["HLD / LLD Design", "BOM Preparation", "RFP/RFI Inputs", "Campus LAN Builds (2-tier / 3-tier)", "POC Execution", "Root-Cause Analysis"] },
    { group: "OEM Exposure", items: ["Cisco", "Palo Alto Networks", "Fortinet", "Zscaler", "SentinelOne", "Check Point", "Arista"] }
  ],
  industries: ["Manufacturing", "Healthcare", "Automotive", "BFSI", "Government / PSU", "IT/ITES"],
  certifications: [
    "Cisco Certified Network Associate (CCNA)",
    "Fortinet Network Security Expert (NSE) 1, 2, 3 & 4",
    "Six Sigma Black Belt"
  ],
  education: [
    { degree: "B.E. — Electronics & Communication", school: "Global Academy of Technology (VTU)", meta: "2016–2019 · 6.8 CGPA" },
    { degree: "Diploma — Electronics & Communication", school: "BET Polytechnic (DTE)", meta: "2013–2016 · 68%" },
    { degree: "High School", school: "Anitha High School (KSEEB)", meta: "2013 · 71%" }
  ]
};

// ---- Renderer: builds the page from RESUME_DATA above ----
(function () {
  const d = RESUME_DATA;
  const list = (a) => (Array.isArray(a) ? a : []);
  const el = (tag, props = {}, children = []) => {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === "class") node.className = v;
      else node.setAttribute(k, v);
    });
    list(children).forEach((c) => node.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return node;
  };

  function renderHeader() {
    const avatar = d.photo
      ? el("img", { class: "avatar", src: d.photo, alt: `Portrait of ${d.name}` })
      : el("div", { class: "avatar", "aria-hidden": "true" }, [d.initials]);

    const contact = el("div", { class: "contact" }, [
      el("a", { href: `tel:${d.phone.replace(/[^+\d]/g, "")}` }, [d.phone]),
      el("a", { href: `mailto:${d.email}` }, [d.email])
    ]);

    const badges = el("div", { class: "badges" },
      list(d.badges).map((b) => el("span", { class: "badge" }, [b]))
    );

    const info = el("div", { class: "info" }, [
      el("p", { class: "eyebrow" }, ["Curriculum Vitae"]),
      el("h1", {}, [d.name]),
      el("p", { class: "sub" }, [d.title]),
      el("p", { class: "sub" }, [d.tagline]),
      contact,
      badges
    ]);

    return el("header", {}, [avatar, info]);
  }

  function renderSummary() {
    return el("section", {}, [
      el("h2", {}, ["Professional Summary"]),
      ...list(d.summary).map((p) => el("p", {}, [p]))
    ]);
  }

  function renderExperience() {
    const jobs = list(d.experience).map((j) =>
      el("div", { class: "job" }, [
        el("h3", {}, [`${j.role} · ${j.company}`]),
        el("p", { class: "meta" }, [j.period]),
        el("ul", {}, list(j.points).map((p) => el("li", {}, [p])))
      ])
    );
    return el("section", {}, [el("h2", {}, ["Professional Experience"]), ...jobs]);
  }

  function renderSkills() {
    const groups = list(d.skills).map((g) =>
      el("div", { class: "group" }, [
        el("h3", {}, [g.group]),
        el("div", { class: "chips" }, list(g.items).map((i) => el("span", { class: "chip" }, [i])))
      ])
    );
    return el("section", {}, [el("h2", {}, ["Technical Skills"]), ...groups]);
  }

  function renderIndustries() {
    return el("section", {}, [
      el("h2", {}, ["Industry Experience"]),
      el("div", { class: "chips" }, list(d.industries).map((i) => el("span", { class: "chip" }, [i])))
    ]);
  }

  function renderCertifications() {
    return el("section", {}, [
      el("h2", {}, ["Certifications"]),
      el("ul", {}, list(d.certifications).map((c) => el("li", {}, [c])))
    ]);
  }

  function renderEducation() {
    const entries = list(d.education).map((e) =>
      el("p", { style: "margin:0 0 10px" }, [
        el("strong", {}, [e.degree]),
        el("br"),
        el("span", { class: "meta" }, [`${e.school} · ${e.meta}`])
      ])
    );
    return el("section", {}, [el("h2", {}, ["Education"]), ...entries]);
  }

  function renderFooter() {
    return el("footer", {}, [`${d.name} · ${d.tagline}`]);
  }

  function render() {
    document.title = `${d.name} | ${d.tagline}`;
    const meta = document.querySelector('meta[name="description"]');
    if (meta) meta.setAttribute("content", `${d.name} — ${d.title}. Resume.`);

    const app = document.getElementById("app");
    app.appendChild(renderHeader());
    app.appendChild(renderSummary());
    app.appendChild(renderExperience());
    app.appendChild(renderSkills());
    app.appendChild(renderIndustries());
    app.appendChild(renderCertifications());
    app.appendChild(renderEducation());
    app.appendChild(renderFooter());
  }

  document.addEventListener("DOMContentLoaded", render);
})();
</script>
</body>
</html>
